<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carta dei Vini — Lagrandissima</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Sidebar */
  --hero:#304d65;--hero2:#1e3347;
  /* Fondali */
  --bg:#F9F6F0;--bg-alt:#F2EDE4;
  /* Testo */
  --ink:#1A1612;--ink-2:#4A4139;--ink-3:#8C7E72;--ink-4:#B8ADA3;
  /* Vecchi alias — mantenuti per compatibilità modal/sort/status */
  --grey:#8C7E72;--gold:#B5A060;
  /* Linee */
  --line:#E0D8CE;--line-s:#CFC7BC;
  /* Tipografia */
  --font-serif:'Playfair Display',Georgia,serif;
  --font-sans:'DM Sans','Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.6;max-width:100%;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}

/* ════════════════════════════════════════════════════════════════
   DESKTOP (≥1024px) — layout a due colonne
   ════════════════════════════════════════════════════════════════ */
@media(min-width:1024px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:row;height:100vh}

  /* ── SIDEBAR COLUMN ── */
  .sidebar-col{
    width:300px;min-width:300px;flex-shrink:0;
    height:100vh;display:flex;flex-direction:column;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(120,160,200,.18) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(80,120,170,.22) 0%, transparent 50%),
      linear-gradient(175deg, #304d65 0%, #1e3347 45%, #162840 100%);
    border-right:1px solid rgba(255,255,255,.06);
    box-shadow: inset -1px 0 0 rgba(0,0,0,.18), 2px 0 12px rgba(0,0,0,.12);
    overflow:hidden;
    position:relative;
  }
  /* sottile luce speculare in alto */
  .sidebar-col::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
    z-index:1;pointer-events:none;
  }

  /* ── LOGO AREA ── */
  .sidebar-brand{
    flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 28px 18px;
    gap:8px;
  }
  .brand-doodle{
    width:80px;height:auto;
    display:block;
    /* sfondo nero → screen per renderlo trasparente */
    mix-blend-mode:screen;
    opacity:.9;
  }
  .brand-logo{
    width:230px;max-width:100%;height:auto;
    mix-blend-mode:screen;
    opacity:.95;
    display:block;
  }
  .brand-sep{
    width:28px;height:1px;
    background:rgba(255,255,255,.2);
    margin-top:0;
  }

  /* ── NAV BUTTONS ── */
  .nav-views{
    flex-shrink:0;
    padding:0 18px 16px;
    display:flex;flex-direction:column;gap:8px;
  }
  .btn-view{
    display:flex;align-items:flex-start;justify-content:space-between;gap:0;
    width:100%;padding:13px 20px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:0;
    background:transparent;
    color:rgba(255,255,255,.45);
    font-family:var(--font-sans);font-size:9px;font-weight:400;
    letter-spacing:.14em;text-transform:uppercase;
    transition:background .18s,color .18s,border-color .18s;
    position:relative;overflow:hidden;
    text-align:left;
    flex-direction:column;gap:3px;
  }
  .btn-view::before{display:none}
  .btn-view .btn-icon{display:none}
  .btn-view-sub{
    font-size:8px;letter-spacing:.04em;text-transform:none;
    font-weight:300;opacity:0;
    transition:opacity .18s;
    line-height:1.4;
    color:rgba(255,255,255,.35);
    display:block;
  }
  .btn-view:hover .btn-view-sub,
  .btn-view.active .btn-view-sub{opacity:1}
  .btn-view:hover{
    background:rgba(255,255,255,.07);
    color:rgba(255,255,255,.75);
    border-color:rgba(255,255,255,.18);
  }
  .btn-view.active{
    background:rgba(255,255,255,.1);
    color:rgba(255,255,255,.95);
    border-color:rgba(255,255,255,.25);
    font-weight:500;
  }

  /* ── FILTRI ── */
  .sidebar-filters{
    flex:1;overflow:hidden;
    display:flex;flex-direction:column;
    max-height:0;
    opacity:0;
    transition:max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    pointer-events:none;
  }
  .sidebar-filters.visible{
    max-height:100vh;
    opacity:1;
    pointer-events:auto;
  }
  .sidebar-filters #sidebar-inner{
    flex:1;overflow-y:auto;padding:16px 0 8px;
  }
  .sidebar-filters #sidebar-inner::-webkit-scrollbar{width:3px}
  .sidebar-filters #sidebar-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}

  /* ── WINE COLUMN ── */
  .wine-col{
    flex:1;height:100vh;overflow-y:auto;min-width:0;
    display:block;
    background:#EDEAE3;
    padding:40px 32px 60px;
    box-sizing:border-box;
  }
  .wine-col .page-wrap{
    width:100%;max-width:820px;
    margin:0 auto;
    background:var(--bg);
    box-shadow:0 1px 20px rgba(26,22,18,.08);
    border-radius:0;
    min-height:calc(100vh - 100px);
    padding-bottom:80px;
    box-sizing:border-box;
  }

  /* ── SEARCH BAR ── */
  .search-bar-wrap{
    width:100%;padding:24px 52px 0;box-sizing:border-box;
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .35s ease,opacity .3s ease,padding .3s ease;
  }
  .search-bar-wrap.visible{max-height:80px;opacity:1;padding:24px 52px 0}
  .search-bar-inner{position:relative}
  .search-input{
    width:100%;padding:11px 40px 11px 16px;
    border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);
    font-family:inherit;font-size:14px;outline:none;
    box-shadow:0 1px 6px rgba(0,0,0,.05);
    transition:border-color .2s,box-shadow .2s;
  }
  .search-input:focus{border-color:var(--hero);box-shadow:0 2px 12px rgba(91,127,166,.15)}
  .search-input::placeholder{color:var(--grey);opacity:.6}
  .search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--grey);display:none;line-height:1;padding:0;background:none;border:none;cursor:pointer}
  .search-clear.show{display:block}

  .wine-col .sort-bar{width:100%;padding:16px 52px 12px;box-sizing:border-box;background:transparent;border-bottom:none}
  .wine-col .main-content{width:100%;padding:28px 52px 52px;box-sizing:border-box}

  .mobile-landing{display:none!important}
  .btn-back-mobile{display:none!important}
  .filter-fab{display:none!important}
  body>.hero,body>.search-wrap{display:none}
}

/* ════════════════════════════════════════════════════════════════
   STILI COMUNI
   ════════════════════════════════════════════════════════════════ */
.sb-acc-wrap{
  margin:0 0 2px;
  overflow:hidden;
}
.sb-acc-wrap:hover{background:rgba(255,255,255,.05)}
.sb-acc-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;cursor:pointer;user-select:none;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sb-acc-title{
  font-family:var(--font-sans);font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);
}
.sb-acc-arrow{font-size:8px;color:rgba(255,255,255,.25);transition:transform .25s ease}
.sb-acc-wrap.open .sb-acc-arrow{transform:rotate(180deg)}
.sb-acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .2s ease;padding:0 20px}
.sb-acc-wrap.open .sb-acc-body{max-height:340px;overflow-y:auto;padding:0 20px 10px}
.cat-list{list-style:none;display:flex;flex-direction:column;gap:0}
.cat-item{
  display:flex;align-items:center;gap:9px;
  padding:7px 0;cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:opacity .1s;font-family:var(--font-sans);
}
.cat-item:last-child{border-bottom:none}
.cat-item:hover{opacity:.7}
.cat-item.active .cat-label{color:rgba(255,255,255,.95);font-weight:500}
.cat-item.active .cat-count{color:rgba(255,255,255,.6)}
.cat-item.cat-empty{opacity:.25;pointer-events:none}
.cat-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.2);flex-shrink:0}
.cat-label{flex:1;font-size:12px;font-weight:400;color:rgba(255,255,255,.6);letter-spacing:.01em}
.cat-count{font-size:10px;color:rgba(255,255,255,.3);font-weight:400;font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.sb-filter-list{list-style:none;display:flex;flex-direction:column}
.sb-filter-item{
  font-family:var(--font-sans);font-size:11.5px;font-weight:400;
  color:rgba(255,255,255,.55);padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;
  transition:color .1s;
}
.sb-filter-item:last-child{border-bottom:none}
.sb-filter-item:hover{color:rgba(255,255,255,.9)}
.sb-filter-item.active{color:rgba(255,255,255,.95);font-weight:500}
.dual-range-wrap{position:relative;height:32px;margin:4px 10px 0}
.dual-range-track{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:3px;background:rgba(255,255,255,.12);border-radius:2px}
.dual-range-fill{position:absolute;top:50%;transform:translateY(-50%);height:3px;background:rgba(255,255,255,.6);border-radius:2px}
.dual-range-wrap input[type=range]{position:absolute;width:100%;top:50%;transform:translateY(-50%);-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;height:20px}
.dual-range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;pointer-events:auto;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.price-row{display:flex;justify-content:space-between;padding:0 10px;font-size:10.5px;color:rgba(255,255,255,.45);margin-top:6px}
.btn-reset-all{
  font-family:var(--font-sans);font-size:9px;font-weight:400;
  letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.25);padding:10px 20px;
  transition:color .15s;background:none;border:none;cursor:pointer;
  display:block;width:100%;text-align:left;
}
.btn-reset-all:hover{color:rgba(255,255,255,.7)}
.sort-bar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.sort-label{font-family:var(--font-sans);font-size:9px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sort-select{border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:11px;padding:4px 8px;outline:none;cursor:pointer;letter-spacing:.02em}
.results-bar{margin-bottom:24px}
.results-count{
  font-family:var(--font-sans);font-size:9px;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);
}
.sezione{margin-bottom:44px}
.sezione-titolo{
  font-family:var(--font-sans);font-size:10px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  padding:0 0 9px 16px;border-bottom:1px solid var(--line-s);margin-bottom:0;
}
/* ── RIGA VINO — sistema editoriale ── */
.vino{
  display:flex;align-items:stretch;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:background .15s ease;
  position:relative;
}
.vino:hover{background:var(--bg-alt)}
.vino:first-child{border-top:1px solid var(--line)}

/* Barra accento categoria: linea verticale 2px, colore via CSS var */
.w-accent-bar{
  width:2px;background:var(--accent,var(--line));
  flex-shrink:0;opacity:.55;
}

.w-body{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:13px 16px 13px 14px;gap:16px;flex:1;min-width:0;
}

/* Colonna sinistra */
.w-sx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

.w-nome{
  font-family:var(--font-serif);font-size:15px;font-weight:400;
  letter-spacing:.01em;color:var(--ink);line-height:1.3;
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
}
.w-annata{
  font-family:var(--font-sans);font-size:11px;font-weight:400;
  color:var(--ink-3);letter-spacing:.02em;
}
.w-formato{
  font-family:var(--font-sans);font-size:9px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent,var(--ink-3));opacity:.8;
}
.w-meta{
  font-family:var(--font-sans);font-size:11px;
  color:var(--ink-2);display:flex;align-items:center;
  gap:5px;flex-wrap:wrap;
}
.w-prod{
  font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;font-size:10px;
}
.w-vitigno{font-style:italic;color:var(--ink-3)}
.w-tipo-label{
  font-size:9px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;opacity:.85;
}
.w-geo{
  font-family:var(--font-sans);font-size:10px;font-weight:400;
  color:var(--ink-4);letter-spacing:.03em;
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
}
.w-sep{
  color:var(--ink-4);font-style:normal;
  font-weight:300;opacity:.5;user-select:none;
}

/* Colonna destra */
.w-dx{flex-shrink:0;text-align:right}
.w-price-wrap{
  display:flex;flex-direction:column;align-items:flex-end;gap:2px;
}
.w-price{
  font-family:var(--font-sans);font-size:16px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--ink);
  letter-spacing:-.01em;white-space:nowrap;
}
.w-calice{
  font-family:var(--font-sans);font-size:10px;
  font-weight:400;color:var(--ink-3);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.w-calice::before{content:"↑ ";opacity:.45;font-size:9px}

/* Vista calice: barra più discreta */
.vino-calice .w-accent-bar{opacity:.3}

/* Retro-compat: slug-based border-left via accent bar (ora via --accent CSS var) */
.vino-sx,.vino-dx,.vino-nome,.vino-prod,.vino-vitigno,
.vino-geo,.vino-prezzo,.vino-bicchiere,.vino-annata,
.vino-formato-badge,.vino-regione,.vino-paese-tag,.vino-geo-sep{
  /* classi legacy — tenute per sicurezza ma non usate dal nuovo markup */
}
.main-content{padding:20px 20px 40px}
/* Nessuna sottolineatura su testi vino (il browser spellcheck non tocca elementi non-editable, ma preveniamo override) */
.w-nome,.w-meta,.w-prod,.w-vitigno,.w-geo,.w-annata,.w-price,.w-calice,.sezione-titolo{
  text-decoration:none;
  -webkit-text-decoration:none;
}
/* accent color ora via --accent CSS custom property (inline su ogni .vino) */
/* classi slug rimosse — gestite da w-accent-bar */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-card{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:0;box-shadow:0 16px 48px rgba(26,22,18,.22);position:relative}
.modal-hero-div{background:linear-gradient(135deg,#5B7FA6,#3d5f7a);padding:28px 28px 22px;position:relative;overflow:hidden;border-radius:16px 16px 0 0}
.modal-hero-doodle{position:absolute;right:-20px;top:-10px;height:120%;pointer-events:none;opacity:.18;mix-blend-mode:screen}
.modal-cat{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:6px;position:relative;z-index:1}
.modal-nome{font-family:var(--font-serif);font-size:22px;font-weight:400;color:#fff;line-height:1.25;position:relative;z-index:1}
.modal-annata{font-size:13px;color:rgba(255,255,255,.65);margin-top:4px;position:relative;z-index:1}
.modal-prezzo{display:flex;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line)}
.modal-p-item{display:flex;flex-direction:column;gap:2px}
.modal-p-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--grey)}
.modal-p-val{font-family:var(--font-sans);font-size:20px;font-weight:300;color:var(--ink);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.modal-body{padding:22px 28px}
.modal-row{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.modal-lbl{color:var(--grey);min-width:90px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding-top:2px;font-weight:600}
.modal-val{color:var(--ink);font-weight:400}
.modal-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;line-height:1;z-index:2;transition:background .2s}
.modal-close:hover{background:rgba(255,255,255,.3)}
#sb-status{position:fixed;bottom:14px;right:14px;z-index:80;display:flex;align-items:center;gap:6px;background:rgba(250,247,241,.92);border:1px solid var(--line);border-radius:20px;padding:5px 12px 5px 8px;box-shadow:0 2px 8px rgba(0,0,0,.08);backdrop-filter:blur(8px);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);user-select:none}
#sb-dot{width:7px;height:7px;border-radius:50%;background:var(--grey);flex-shrink:0;transition:background .4s,box-shadow .4s}
#sb-dot.ok{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
#sb-dot.sync{background:var(--gold);animation:pulse 1s infinite}
#sb-dot.err{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* drawer mobile */
.drawer-overlay{
  position:fixed;inset:0;
  background:rgba(26,22,18,0);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease,background .3s ease;
  z-index:100;
}
.drawer-overlay.show{
  opacity:1;pointer-events:auto;
  background:rgba(26,22,18,.42);
}
.filter-drawer{
  position:fixed;bottom:0;left:0;right:0;z-index:101;
  background:var(--bg);
  border-top:1px solid var(--line-s);
  border-radius:0;          /* foglio, non modale */
  max-height:78vh;overflow-y:auto;
  overscroll-behavior:contain;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  padding:0 20px 40px;
  -webkit-overflow-scrolling:touch;
}
.filter-drawer.open{transform:translateY(0)}
/* Handle: linea sottile, non pillola */
.filter-drawer::before{
  content:'';display:block;
  width:28px;height:1px;
  background:var(--line-s);
  margin:16px auto 4px;
}
.drawer-handle{display:none} /* sostituito da ::before */
.drawer-hdr{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0 14px;
  border-bottom:1px solid var(--line);
  margin-bottom:4px;
}
.drawer-hdr span{
  font-family:var(--font-sans);font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.drawer-hdr button{
  font-size:18px;line-height:1;color:var(--ink-3);
  background:none;border:none;cursor:pointer;padding:0;
}
.drawer-body{padding:0 0 60px}
.drawer-apply{
  position:sticky;bottom:0;padding:10px 0;
  background:var(--bg);border-top:1px solid var(--line);
}
.drawer-apply button{
  width:100%;padding:12px;
  background:var(--ink);color:var(--bg);
  font-family:var(--font-sans);font-size:10px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;
  border:none;border-radius:0;cursor:pointer;
  transition:background .15s;
}
.drawer-apply button:hover{background:var(--ink-2)}

/* Drawer: override colori — usa palette chiara */
#filter-drawer .sb-acc-wrap{border-bottom:1px solid var(--line);margin:0}
#filter-drawer .sb-acc-head{border-bottom:1px solid var(--line);padding:10px 0}
#filter-drawer .sb-acc-title{color:var(--ink-3)}
#filter-drawer .sb-acc-arrow{color:var(--ink-4)}
#filter-drawer .sb-acc-body{padding:0}
#filter-drawer .sb-acc-wrap.open .sb-acc-body{padding:0 0 8px}
#filter-drawer .cat-item{border-bottom-color:var(--line);padding:7px 0}
#filter-drawer .cat-label{color:var(--ink-2)}
#filter-drawer .cat-item.active .cat-label{color:var(--ink)}
#filter-drawer .cat-dot{background:var(--line-s)}
#filter-drawer .cat-count{color:var(--ink-4)}
#filter-drawer .sb-filter-item{color:var(--ink-2);border-bottom-color:var(--line);padding:6px 0}
#filter-drawer .sb-filter-item:hover{color:var(--ink);background:none}
#filter-drawer .sb-filter-item.active{color:var(--ink);font-weight:500}
#filter-drawer .dual-range-track{background:var(--line)}
#filter-drawer .dual-range-fill{background:var(--ink-3)}
#filter-drawer .dual-range-wrap input[type=range]::-webkit-slider-thumb{background:var(--ink);box-shadow:none}
#filter-drawer .price-row{color:var(--ink-3)}
#filter-drawer .btn-reset-all{color:var(--ink-4);padding:10px 0}
#filter-drawer .btn-reset-all:hover{color:var(--ink);background:none}
.filter-fab{
  display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:90;
  height:44px;padding:0 22px;
  background:var(--ink);color:var(--bg);
  border:none;border-radius:22px;
  font-family:var(--font-sans);font-size:10px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;
  align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(26,22,18,.28);
  transition:background .15s,box-shadow .15s;
  white-space:nowrap;
}
.filter-fab:active{background:var(--ink-2);box-shadow:0 2px 8px rgba(26,22,18,.2)}
.filter-fab .fab-icon{font-size:13px;line-height:1;opacity:.8}
.fab-badge{
  display:none;
  background:#fff;color:var(--ink);
  border-radius:10px;
  font-family:var(--font-sans);font-size:10px;font-weight:700;
  padding:2px 7px;
  font-variant-numeric:tabular-nums;
  line-height:1.4;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.fab-badge.show{display:inline}

/* ════════════════════════════════════════════════════════════════
   MOBILE (≤1023px)
   ════════════════════════════════════════════════════════════════ */
@media(max-width:1023px){
  body>.sidebar-col{display:none}
  .filter-fab{display:flex}
  #mobile-hero{display:none!important}
  .mobile-landing{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:0 32px 0;
    background:linear-gradient(175deg,#304d65 0%,#1e3347 60%,#162840 100%);
    position:fixed;inset:0;z-index:50;
    transition:opacity .22s ease,transform .22s ease;
    opacity:1;transform:translateY(0);
  }
  .mobile-landing.hidden{display:none!important}
  .mobile-landing.is-leaving{opacity:0;transform:translateY(-8px);pointer-events:none}
  .mobile-landing-doodle{width:72px;mix-blend-mode:screen;opacity:.85;margin-bottom:14px}
  .mobile-landing-logo{max-width:280px;width:88%;mix-blend-mode:screen;opacity:.95;margin-bottom:8px}
  .mobile-landing-sub{
    font-family:var(--font-sans);font-size:9px;letter-spacing:.4em;
    text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:52px;font-weight:400;
  }
  .mobile-nav-btns{display:flex;flex-direction:column;gap:0;width:100%;max-width:340px}
  .mobile-nav-btn{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;padding:20px 0;
    border:none;border-bottom:1px solid rgba(255,255,255,.1);
    background:transparent;
    color:rgba(255,255,255,.65);
    font-family:var(--font-sans);font-size:11px;font-weight:400;
    letter-spacing:.12em;text-transform:uppercase;
    transition:color .18s;cursor:pointer;
  }
  .mobile-nav-btn:first-child{border-top:1px solid rgba(255,255,255,.1)}
  .mobile-nav-btn:hover,.mobile-nav-btn:active{color:rgba(255,255,255,.95)}
  .mobile-nav-btn .btn-arrow{font-size:16px;opacity:.35;transition:opacity .18s,transform .18s;flex-shrink:0}
  .mobile-nav-btn:hover .btn-arrow{opacity:.8;transform:translateX(3px)}
  /* FAB nascosto sulla landing, visibile solo in list view */
  .filter-fab{display:none!important}
  body.mobile-list-view .filter-fab{display:flex!important}
  .btn-back-mobile{
    display:flex!important;align-items:center;gap:8px;
    position:fixed;top:0;left:0;right:0;z-index:49;
    background:var(--hero2);color:rgba(255,255,255,.85);
    border-bottom:none;
    padding:14px 18px;
    font-family:var(--font-sans);font-size:10px;font-weight:400;
    letter-spacing:.12em;text-transform:uppercase;
    border:none;cursor:pointer;
  }
  .btn-back-mobile::before{
    content:"←";font-size:14px;opacity:.7;margin-right:2px;
    font-weight:300;letter-spacing:0;
  }
  body.mobile-list-view .wine-col{padding-top:44px}
  .hero{background:var(--hero);padding:28px 16px 18px;text-align:center;position:relative;overflow:hidden}
  .hero-doodle{position:absolute;top:0;height:100%;pointer-events:none;object-fit:contain;mix-blend-mode:screen;opacity:.25}
  .hero-doodle.left{left:-10px;transform:scaleX(-1)}
  .hero-doodle.right{right:-10px}
  .hero-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px}
  .hero-logo{width:180px;mix-blend-mode:screen;opacity:.95}
  .wine-col{display:flex;flex-direction:column;min-height:100vh}
  .page-wrap{display:block;width:100%}
  .main-content{padding:8px 4px}
  .sort-bar{padding:6px 8px;flex-wrap:wrap;gap:6px}
  .sezione{margin-bottom:20px}
  .sezione-titolo{font-size:11px;padding:12px 4px 10px}
  .vino{padding:12px 10px 12px 14px;gap:8px}
  .vino-nome{font-size:14px}
  .vino-dx{min-width:52px}
  .vino-prezzo{font-size:15px}
  .modal-overlay{padding:0;align-items:flex-end;backdrop-filter:none}
  .modal-card{max-width:100%;max-height:92vh;border-radius:0;margin:0}
  .modal-nome{font-size:18px}
  .modal-body{padding:14px 16px}
  .modal-prezzo{padding:10px 16px}
  /* Search bar mobile: ben visibile, non trasparente */
  .search-bar-wrap{
    padding:12px 14px 8px;
    max-height:none!important;opacity:1!important;overflow:visible!important;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .search-bar-wrap .search-input{
    border-radius:6px;
    border:1.5px solid var(--line-s);
    box-shadow:0 1px 4px rgba(0,0,0,.06);
    background:#fff;
    padding:11px 40px 11px 36px;
    font-size:15px;
  }
  .search-bar-inner::before{
    content:"🔍";
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    font-size:14px;pointer-events:none;opacity:.45;
  }
  .sezione-titolo{padding-left:12px}
  .w-body{padding-left:10px}
  .mobile-list-view #wine-list{animation:listEnter .25s ease forwards}
  @keyframes listEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
}
</style>
</head>
<body>

<!-- ── MOBILE LANDING ── -->
<div class="mobile-landing" id="mobile-landing">
  <img class="mobile-landing-doodle" src="doodle_transparent.png" alt="">
  <img class="mobile-landing-logo" src="logo_transparent.png" alt="Lagrandissima">
  <div class="mobile-landing-sub">Carta dei Vini</div>
  <div class="mobile-nav-btns">
    <button class="mobile-nav-btn" onclick="setViewMobile('calice')">
      <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
        <span>Al calice</span>
        <span style="font-size:9px;opacity:.45;letter-spacing:.06em;text-transform:none;font-weight:300">Vini disponibili a bicchiere</span>
      </span>
      <span class="btn-arrow">→</span>
    </button>
    <button class="mobile-nav-btn" onclick="setViewMobile('mescita')">
      <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
        <span>Carta Breve</span>
        <span style="font-size:9px;opacity:.45;letter-spacing:.06em;text-transform:none;font-weight:300">Per bere bene senza pensarci troppo</span>
      </span>
      <span class="btn-arrow">→</span>
    </button>
    <button class="mobile-nav-btn" onclick="setViewMobile('cantina')">
      <span style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">
        <span>Cantina completa</span>
        <span style="font-size:9px;opacity:.45;letter-spacing:.06em;text-transform:none;font-weight:300">Tutta la nostra selezione, per chi vuole scegliere con calma</span>
      </span>
      <span class="btn-arrow">→</span>
    </button>
  </div>
</div>

<!-- ── BACK BUTTON MOBILE ── -->
<button class="btn-back-mobile" id="btn-back-mobile" style="display:none" onclick="backToLanding()">Indietro</button>

<!-- ── DESKTOP SIDEBAR ── -->
<div class="sidebar-col">

  <!-- Brand -->
  <div class="sidebar-brand">
    <img class="brand-doodle" src="doodle_transparent.png" alt="">
    <img class="brand-logo" src="logo_transparent.png" alt="Lagrandissima">
    <div class="brand-sep"></div>
  </div>

  <!-- Nav buttons -->
  <div class="nav-views">
    <button class="btn-view active" data-view="calice" onclick="setView('calice')">
      Al Calice
      <span class="btn-view-sub">Vini disponibili a bicchiere</span>
    </button>
    <button class="btn-view" data-view="mescita" onclick="setView('mescita')">
      Carta Breve
      <span class="btn-view-sub">Per bere bene senza pensarci troppo</span>
    </button>
    <button class="btn-view" data-view="cantina" onclick="setView('cantina')">
      Cantina
      <span class="btn-view-sub">Tutta la nostra selezione, per chi vuole scegliere con calma</span>
    </button>
  </div>

  <!-- Filtri: visibili SOLO con cantina completa -->
  <div class="sidebar-filters" id="sidebar-filters">
    <div id="sidebar-inner"></div>
  </div>

</div><!-- /sidebar-col -->

<!-- ── WINE COLUMN ── -->
<div class="wine-col">
  <!-- Hero solo mobile -->
  <div class="hero" id="mobile-hero" style="display:none">
    <img class="hero-doodle left" src="doodle_transparent.png" alt="">
    <img class="hero-doodle right" src="doodle_transparent.png" alt="">
    <div class="hero-inner">
      <img class="hero-logo" src="logo_transparent.png" alt="Lagrandissima">
    </div>
  </div>

  <div class="page-wrap">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">

      <!-- Search bar: visibile solo cantina -->
      <div class="search-bar-wrap" id="search-bar-wrap">
        <div class="search-bar-inner">
          <input class="search-input" id="search-input" type="text" spellcheck="false"
            placeholder="Cerca vino, produttore, vitigno…" oninput="onSearch(this)">
          <button class="search-clear" id="search-clear" onclick="clearSearch()">×</button>
        </div>
      </div>

      <div class="sort-bar" id="sort-bar-wrap"></div>
      <div class="main-content">
        <div class="results-bar"><span class="results-count" id="results-count">—</span></div>
        <div id="wine-list" spellcheck="false"><div class="vuoto">Caricamento in corso…</div></div>
      </div>
    </div>
  </div>
</div><!-- /wine-col -->

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal-card" id="modal-card">
    <button class="modal-close" onclick="closeModalDirect()">×</button>
    <div class="modal-hero-div" id="modal-hero">
      <img class="modal-hero-doodle" src="doodle_transparent.png" alt="">
      <div class="modal-cat" id="modal-cat"></div>
      <div class="modal-nome" id="modal-nome"></div>
      <div class="modal-annata" id="modal-annata"></div>
    </div>
    <div class="modal-prezzo" id="modal-prezzo"></div>
    <div class="modal-body" id="modal-body"></div>
    <div id="modal-note-wrap" style="display:none;padding:14px 28px;border-top:1px solid var(--line)">
      <div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-bottom:6px">Nota del sommelier</div>
      <div id="modal-note-text" style="font-size:13px;color:var(--ink);font-style:italic;line-height:1.6"></div>
    </div>
  </div>
</div>

<!-- Drawer filtri mobile -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="filter-drawer" id="filter-drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-hdr"><span>Filtri</span><button onclick="closeDrawer()">×</button></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-apply"><button onclick="closeDrawer()">Mostra risultati</button></div>
</div>
<button class="filter-fab" id="filter-fab" onclick="openDrawer()">
  <span class="fab-icon">≡</span> Filtri <span class="fab-badge" id="fab-badge">0</span>
</button>

<div id="sb-status" title="Stato connessione live">
  <span id="sb-dot"></span><span id="sb-lbl">DB</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="carta.js"></script>
</body>
</html>
